<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- SEO Meta Tags -->
		<meta name="description" content="Satoshi Dashboard - Bitcoin analytics and real-time data visualization" />
		<meta name="theme-color" content="#0a0a0f" />
		<meta name="color-scheme" content="dark" />

		<!-- Open Graph -->
		<meta property="og:title" content="Satoshi Dashboard" />
		<meta property="og:description" content="Bitcoin analytics and real-time data visualization" />
		<meta property="og:type" content="website" />

		<!-- Preload Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />

		<!-- PWA Meta Tags -->
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<meta name="apple-mobile-web-app-capable" content="true" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Satoshi" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
